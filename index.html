<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Spendly</title>
  <meta name="description" content="Track daily and monthly spending by tier." />
  <meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Spendly" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="title-block">
        <span id="viewSub" class="sub"></span>
        <h1 id="viewTitle">Today</h1>
      </div>
      <button id="syncBadge" class="sync-badge" aria-label="Sync status"></button>
    </header>
    <main id="view"></main>
  </div>

  <button id="fab" class="fab" aria-label="Add expense" data-icon="plus"></button>

  <nav class="tabbar" aria-label="Sections">
    <button data-tab="today" class="active"><span data-icon="today"></span><span>Today</span></button>
    <button data-tab="month"><span data-icon="chart"></span><span>Month</span></button>
    <button data-tab="budget"><span data-icon="wallet"></span><span>Budget</span></button>
    <button data-tab="settings"><span data-icon="settings"></span><span>Settings</span></button>
  </nav>

  <div id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="grabber"></div>
      <div class="sheet-head">
        <button class="txt" data-close>Cancel</button>
        <h2 id="sheetTitle">New expense</h2>
        <button id="deleteBtn" class="txt danger" hidden>Delete</button>
      </div>

      <div class="amount-wrap">
        <div class="amount" id="amountDisplay"><span class="cur" id="amountCur"></span><span id="amountVal">0</span><span class="cur suf" id="amountSuf">TND</span></div>
        <div class="selected-cat" id="selectedCat"></div>
      </div>

      <div class="cat-grid" id="catGrid"></div>

      <div class="sheet-meta">
        <input id="noteInput" type="text" placeholder="Add a note" maxlength="80" autocomplete="off" enterkeyhint="done" />
        <label class="date-chip"><span data-icon="calendar"></span><span id="dateLabel">Now</span><input id="dateInput" type="datetime-local" aria-label="Date and time" /></label>
      </div>

      <div class="keypad" id="keypad">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <button>.</button><button>0</button>
        <button data-key="back" aria-label="Delete digit"><span data-icon="backspace"></span></button>
      </div>

      <button id="saveBtn" class="save-btn" disabled>Save</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="icons.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
