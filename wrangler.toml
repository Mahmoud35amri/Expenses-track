# Cloudflare Pages project: static app + /api functions + D1 database.
# The database_id placeholder is filled in by the GitHub Action at deploy time.
name = "spendly-m35a"
pages_build_output_dir = "./dist"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "spendly-db"
database_id = "__D1_DATABASE_ID__"
